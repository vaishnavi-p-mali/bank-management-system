<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Bank Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .card {
            width: 420px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #1e3a8a;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #162d6b;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            line-height: 1.6;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #15803d;
        }

        .token-box {
            margin-top: 15px;
            padding: 15px;
            background: #f4f7fb;
            border-radius: 8px;
            word-break: break-all;
            font-size: 13px;
            color: #1e3a8a;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="logo">🔑</div>

        <h1>Forgot Password</h1>

        <p class="subtitle">
            Enter your registered email address.
            We'll generate a reset token you can use
            to set a new password.
        </p>

        <form id="forgotForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                required>

            <button type="submit" class="submit-btn">
                Generate Reset Token
            </button>

        </form>

        <a href="/login" class="back-link">
            ← Back to Login
        </a>

        <div id="result"></div>

    </div>

    <script>

        document
            .getElementById("forgotForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const result = document.getElementById("result");

                result.innerHTML = "";

                fetch("/api/customers/forgot-password", {

                    method: "POST",

                    headers: { "Content-Type": "application/json" },

                    body: JSON.stringify({ email: email })

                })

                .then(async response => {

                    const text = await response.text();

                    let data;

                    try {
                        data = JSON.parse(text);
                    } catch {
                        data = {};
                    }

                    if (!response.ok) {
                        throw new Error(
                            data.message || text || "Something went wrong"
                        );
                    }

                    return data;

                })

                .then(data => {

                    result.innerHTML = `

                        <div class="success">
                            ✅ ${data.message}
                        </div>

                        <div class="token-box">
                            <strong>Your Reset Token:</strong><br>
                            ${data.resetToken}
                        </div>

                        <a href="/reset-password" class="back-link">
                            Continue to Reset Password →
                        </a>

                    `;

                })

                .catch(error => {

                    console.error(error);

                    result.innerHTML = `
                        <div class="error">
                            ❌ ${error.message}
                        </div>
                    `;

                });

            });

    </script>

</body>

</html>
