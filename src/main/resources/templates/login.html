<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Login - Bank Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: #1e3a8a;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .home-btn {
            background: white;
            color: #1e3a8a;

            border: none;

            padding: 10px 18px;

            border-radius: 6px;

            text-decoration: none;

            font-weight: bold;

            cursor: pointer;
        }

        .home-btn:hover {
            background: #e5e7eb;
        }

        /* ================= LOGIN CONTAINER ================= */

        .container {
            width: 420px;

            max-width: 90%;

            margin: 70px auto;
        }

        .card {
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            text-align: center;

            color: #1e3a8a;

            margin-top: 0;

            margin-bottom: 30px;
        }

        /* ================= FORM ================= */

        label {
            display: block;

            margin-top: 16px;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #1e3a8a;
        }

        /* ================= FORGOT PASSWORD LINK ================= */

        .forgot-link {
            text-align: right;

            margin-top: 10px;
        }

        .forgot-link a {
            color: #1e3a8a;

            font-size: 13px;

            font-weight: bold;

            text-decoration: none;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        /* ================= LOGIN BUTTON ================= */

        .login-btn {
            width: 100%;

            padding: 12px;

            margin-top: 20px;

            border: none;

            border-radius: 6px;

            background: #1e3a8a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #162d6b;
        }

        /* ================= RESULT ================= */

        #result {
            margin-top: 20px;

            text-align: center;

            line-height: 1.7;
        }

        .success {
            color: #15803d;

            font-weight: bold;
        }

        .error {
            color: #dc2626;

            font-weight: bold;
        }

        /* ================= REGISTER LINK ================= */

        .register-link {
            text-align: center;

            margin-top: 20px;

            color: #666;
        }

        .register-link a {
            color: #1e3a8a;

            font-weight: bold;

            text-decoration: none;
        }

        /* ================= ADMIN LINK ================= */

        .admin-link {
            text-align: center;

            margin-top: 15px;

            padding-top: 15px;

            border-top: 1px solid #e5e7eb;

            color: #666;

            font-size: 13px;
        }

        .admin-link a {
            color: #6b7280;

            font-weight: bold;

            text-decoration: none;
        }

        .admin-link a:hover {
            text-decoration: underline;
            color: #1e3a8a;
        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

        <div class="navbar">
        <h2>🏦 Bank Management System</h2>
        <a href="/" class="home-btn">🏠 Home</a>
    </div>


    <!-- ================= LOGIN FORM ================= -->

    <div class="container">

        <div class="card">

            <h3>
                Customer Login
            </h3>


            <form id="loginForm">


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>


                <!-- FORGOT PASSWORD -->

                <div class="forgot-link">

                    <a href="/forgot-password">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn">

                    🔐 Login

                </button>


            </form>


            <!-- RESULT -->

            <div id="result"></div>


            <!-- REGISTER -->

            <div class="register-link">

                Don't have an account?

                <a href="/register">
                    Register here
                </a>

            </div>


            <!-- ADMIN LOGIN -->

            <div class="admin-link">

                Are you an administrator?

                <a href="/admin-login">
                    Admin Login →
                </a>

            </div>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const email =
                    document
                    .getElementById("email")
                    .value.trim();


                const password =
                    document
                    .getElementById("password")
                    .value;


                const result =
                    document
                    .getElementById("result");


                result.innerHTML = "";


                fetch(
                    "/api/customers/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })

                    }
                )


                .then(response => {

                    if (!response.ok) {

                        return response.text()
                            .then(message => {

                                throw new Error(message);

                            });

                    }

                    return response.json();

                })


                .then(data => {

                    result.innerHTML = `

                        <div class="success">

                            Login Successful! 🎉

                            <br>

                            Welcome,
                            ${data.name}

                        </div>

                    `;


                    /*
                     * Wait for a moment and then
                     * open customer dashboard.
                     */

                    setTimeout(function() {

                        window.location.href =
                            "/customer-dashboard";

                    }, 800);

                })


                .catch(error => {

                    console.error(error);

                    result.innerHTML = `

                        <div class="error">

                            Login Failed.

                            <br>

                            Invalid email or password.

                        </div>

                    `;

                });

            });

    </script>


</body>

</html>
