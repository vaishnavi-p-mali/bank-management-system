<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Bank Account</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back-btn {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #e5e7eb;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: 60px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            text-align: center;
            color: #1e3a8a;
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus,
        select:focus {

            outline: none;

            border-color: #1e3a8a;

        }

        .create-btn {

            width: 100%;

            padding: 12px;

            margin-top: 25px;

            border: none;

            border-radius: 6px;

            background: #1e3a8a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .create-btn:hover {

            background: #162d6b;

        }

        #result {

            margin-top: 20px;

            text-align: center;

            line-height: 1.6;

        }

        .success {

            color: #15803d;

            font-weight: bold;

        }

        .error {

            color: #dc2626;

            font-weight: bold;

        }

    </style>

</head>


<body>


    <div class="navbar">

        <h2>🏦 Bank Management System</h2>

        <button class="back-btn"
                onclick="goBack()">

            Back

        </button>

    </div>


    <div class="container">

        <div class="card">

            <h3>Create Bank Account</h3>


            <form id="accountForm">


                <label for="customerId">
                    Customer ID
                </label>

                <input
                    type="number"
                    id="customerId"
                    placeholder="Enter customer ID"
                    required>


                <label for="accountType">
                    Account Type
                </label>

                <select
                    id="accountType"
                    required>

                    <option value="">
                        Select Account Type
                    </option>

                    <option value="SAVINGS">
                        Savings Account
                    </option>

                    <option value="CURRENT">
                        Current Account
                    </option>

                </select>


                <button
                    type="submit"
                    class="create-btn">

                    Create Account

                </button>

            </form>


            <div id="result"></div>

        </div>

    </div>


    <script>


        document
            .getElementById("accountForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const customerId =
                    document
                    .getElementById("customerId")
                    .value;


                const accountType =
                    document
                    .getElementById("accountType")
                    .value;


                const result =
                    document
                    .getElementById("result");


                result.innerHTML = "";


                fetch(
                    "/api/accounts/create?customerId="
                    + customerId
                    + "&accountType="
                    + accountType,
                    {
                        method: "POST"
                    }
                )


                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Unable to create account"
                        );

                    }

                    return response.json();

                })


                .then(data => {

                    result.innerHTML = `

                        <div class="success">

                            Account Created Successfully! 🎉

                            <br><br>

                            Account Number:
                            <strong>
                                ${data.accountNumber}
                            </strong>

                            <br>

                            Account Type:
                            ${data.accountType}

                            <br>

                            Balance:
                            ₹${data.balance}

                        </div>

                    `;

                })


                .catch(error => {

                    console.error(error);

                    result.innerHTML = `

                        <div class="error">

                            Failed to create account.

                            <br>

                            Please check Customer ID.

                        </div>

                    `;

                });

            });


        function goBack() {

            window.location.href = "/register";

        }


    </script>


</body>

</html>
