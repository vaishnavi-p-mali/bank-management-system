<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Bank Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .card {
            width: 420px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #1e3a8a;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #15803d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #166534;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            line-height: 1.6;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #15803d;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="logo">🔐</div>

        <h1>Reset Password</h1>

        <p class="subtitle">
            Paste the reset token you received
            and choose a new password.
        </p>

        <form id="resetForm">

            <label for="token">Reset Token</label>

            <input
                type="text"
                id="token"
                placeholder="Paste your reset token"
                required>

            <label for="newPassword">New Password</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required>

            <button type="submit" class="submit-btn">
                Reset Password
            </button>

        </form>

        <a href="/login" class="back-link">
            ← Back to Login
        </a>

        <div id="result"></div>

    </div>

    <script>

        document
            .getElementById("resetForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const token =
                    document.getElementById("token").value.trim();

                const newPassword =
                    document.getElementById("newPassword").value;

                const result = document.getElementById("result");

                result.innerHTML = "";

                fetch("/api/customers/reset-password", {

                    method: "POST",

                    headers: { "Content-Type": "application/json" },

                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })

                })

                                .then(async response => {

                    const text = await response.text();

                    if (!response.ok) {

                        let errorMessage = "Reset failed. Please try again.";

                        try {

                            const errors = JSON.parse(text);
                            const messages = Object.values(errors);

                            if (messages.length > 0) {
                                errorMessage = messages.join(" ");
                            }

                        } catch (parseError) {

                            if (text) {
                                errorMessage = text;
                            }

                        }

                        throw new Error(errorMessage);

                    }

                    return text;

                })

                .then(message => {

                    result.innerHTML = `

                        <div class="success">
                            ✅ ${message}
                        </div>

                        <a href="/login" class="back-link">
                            Go to Login →
                        </a>

                    `;

                    document.getElementById("resetForm").style.display = "none";

                })

                .catch(error => {

                    console.error(error);

                    result.innerHTML = `
                        <div class="error">
                            ❌ ${error.message}
                        </div>
                    `;

                });

            });

    </script>

</body>

</html>
